<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>地球桌面 壁纸</title>
<style>
  * { margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #03060e;
    overflow: hidden;
    cursor: default;
    user-select: none; -webkit-user-select: none;
  }
  canvas { display: block; width: 100%; height: 100%; }
  #fallback {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    color: rgba(255,255,255,0.35);
    font: 14px "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.06em;
  }
  body.failed #fallback { display: flex; }
  body.failed canvas { display: none; }
</style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="fallback">地球渲染不可用 — WebGL2 未启用</div>
  <script type="module" src="earth.js"></script>
</body>
</html>
