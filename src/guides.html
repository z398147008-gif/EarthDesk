<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>地球桌面 guides</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
  .line { position: absolute; background: rgba(120, 190, 255, 0.9); }
  .line.v { top: 0; bottom: 0; width: 1px; }
  .line.h { left: 0; right: 0; height: 1px; }
</style>
</head>
<body>
  <script type="module">
    const { listen } = window.__TAURI__.event;

    listen("guides", (event) => {
      const payload = event.payload || {};
      const lines = Array.isArray(payload) ? payload : payload.lines || [];
      const origin = payload.origin || [0, 0];
      const ratio = window.devicePixelRatio || 1;

      document.body.replaceChildren(
        ...lines.map((g) => {
          const el = document.createElement("div");
          el.className = `line ${g.orient}`;
          const local = (g.pos - origin[g.orient === "v" ? 0 : 1]) / ratio;
          el.style[g.orient === "v" ? "left" : "top"] = `${local}px`;
          return el;
        })
      );
    });
  </script>
</body>
</html>
