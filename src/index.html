<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>地球桌面 天气</title>
<link rel="stylesheet" href="shared.css" />
<link rel="stylesheet" href="weather.css" />
</head>
<body>
  <div class="surface"></div>

  <article class="card tone-cloudy" id="card">
    <div class="bg" aria-hidden="true"><canvas class="sky" id="sky"></canvas><div class="veil"></div></div>
    <header class="head">
      <div class="head-left">
        <div class="place"><span id="place">—</span><svg class="arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M14.2 1.8 1.9 7.1c-.5.2-.4.9.1 1l5 .9.9 5c.1.5.8.6 1 .1l5.3-12.3c.1-.3-.2-.6-.5-.5Z"/></svg></div>
        <div class="now-temp"><span id="temp">--</span><span class="deg">°</span></div>
      </div>
      <div class="head-right">
        <img class="now-icon" id="icon" alt="" />
        <div class="cond" id="cond">—</div>
        <div class="hilo">最高 <b id="hi">--</b>° 最低 <b id="lo">--</b>°</div>
      </div>
    </header>

    <section class="hours" id="hours"></section>

    <section class="days" id="days"></section>

    <footer class="status" id="status"></footer>
  </article>

  <div class="resize-handle"></div>
  <script type="module" src="widget.js"></script>
  <script type="module" src="weather.js"></script>
</body>
</html>
