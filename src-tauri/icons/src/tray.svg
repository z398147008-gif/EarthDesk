<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 地球桌面 tray icon: the earth from space, lit from the upper left,
       night side with a few city lights, a thin bright atmosphere. -->
  <defs>
    <linearGradient id="sphere" x1="0.12" y1="0.1" x2="0.92" y2="0.95">
      <stop offset="0" stop-color="#a6ecff"/>
      <stop offset="0.3" stop-color="#46a8f5"/>
      <stop offset="0.55" stop-color="#1f5fcf"/>
      <stop offset="0.75" stop-color="#12337d"/>
      <stop offset="1" stop-color="#0a1a45"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.26" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0.1" y1="0.1" x2="0.85" y2="0.9">
      <stop offset="0" stop-color="#e6fbff" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#9fe0ff" stop-opacity="0.55"/>
      <stop offset="0.8" stop-color="#9fe0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4f5cf" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#58c88a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#2d7a6a" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ball"><circle cx="16" cy="16" r="13.6"/></clipPath>
  </defs>
  <g transform="translate(16 16) scale(1.06) translate(-16 -16)">
  <circle cx="16" cy="16" r="13.6" fill="url(#sphere)"/>
  <g clip-path="url(#ball)">
    <path fill="url(#land)" d="M7.2 8.2c2.4-1.9 6.2-2.4 8.3-1 1.4.9.5 2.4-1 2.8-1.6.4-2 1.8-.8 2.8 1.2 1.1.6 2.9-1 3.3-1.8.5-2.6 2.1-4 2.4-1.8.4-2.8-1.1-3.2-2.9-.5-2.3 0-5.5 1.7-7.4z"/>
    <path fill="url(#land)" d="M18 9.6c2-.9 5.2-.6 7.3 1.2 1.5 1.3 2 3.3 1.1 4.6-.8 1.1-2.2.7-3.1 1.7-1 1.1-.3 3-1.5 3.9-1.3 1-3.3.1-4-1.4-.7-1.6.4-2.9-.3-4.2-.7-1.2-2.1-1.5-1.8-3.1.2-1.1 1.1-2.1 2.3-2.7z"/>
    <path d="M4 14.2c4.2-2.2 9-2.6 13.5-1.4" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="16" cy="16" r="13.6" fill="url(#shine)"/>
    <!-- city lights on the night side -->
    <g fill="#ffd27a">
      <circle cx="21.6" cy="22.8" r="0.75"/><circle cx="24.4" cy="19.6" r="0.6"/>
      <circle cx="19.2" cy="25.6" r="0.55"/><circle cx="25.6" cy="23.2" r="0.5"/>
    </g>
  </g>
  <circle cx="16" cy="16" r="13.6" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
  <circle cx="16" cy="16" r="14.3" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="0.8"/>
  </g>
</svg>
