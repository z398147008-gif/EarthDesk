<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 地球桌面 tray icon: a small lit globe (day side upper left, night lower right). -->
  <defs>
    <radialGradient id="sea" cx="0.36" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#8fd0ff"/>
      <stop offset="0.45" stop-color="#3a93ec"/>
      <stop offset="1" stop-color="#1c5cc0"/>
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9be27a"/>
      <stop offset="1" stop-color="#3fae5e"/>
    </linearGradient>
    <clipPath id="ball"><circle cx="16" cy="16" r="14"/></clipPath>
  </defs>
  <circle cx="16" cy="16" r="14" fill="url(#sea)"/>
  <g clip-path="url(#ball)">
    <!-- continents, simplified -->
    <path fill="url(#land)" d="M9 7.5c2.2-1.6 5.6-1.9 7.4-.6 1.2.9.4 2.3-1 2.6-1.5.3-1.9 1.6-.8 2.6 1.1 1 .6 2.6-.9 3-1.6.4-2.4 1.9-3.6 2.2-1.6.4-2.5-1-2.9-2.6-.5-2.1-.1-5.4 1.8-7.2z"/>
    <path fill="url(#land)" d="M19.5 10.2c1.8-.8 4.7-.5 6.6 1.1 1.4 1.2 1.8 3 1 4.2-.7 1-2 .6-2.8 1.5-.9 1-.3 2.7-1.4 3.5-1.2.9-3 .1-3.6-1.3-.6-1.4.4-2.6-.3-3.8-.6-1.1-1.9-1.4-1.6-2.8.2-1 1-1.9 2.1-2.4z"/>
    <path fill="url(#land)" d="M12.6 20.8c1.2-.5 2.8.2 3.1 1.5.3 1.4-.6 3.3-1.8 4.3-.8.6-1.9.3-2.1-.7-.3-1.4-.9-2.4-.4-3.6.2-.6.6-1.2 1.2-1.5z"/>
    <!-- night side -->
    <path fill="#0a1d4a" fill-opacity="0.62" fill-rule="evenodd" d="M0 0H32V32H0Z M-6 10a17 17 0 1 0 34 0a17 17 0 1 0 -34 0Z"/>
  </g>
  <!-- atmosphere rim and a highlight -->
  <circle cx="16" cy="16" r="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
  <circle cx="16" cy="16" r="14.4" fill="none" stroke="#0c2b66" stroke-opacity="0.55" stroke-width="0.9"/>
  <ellipse cx="10.8" cy="9.6" rx="3.2" ry="2.2" fill="#ffffff" fill-opacity="0.28" transform="rotate(-35 10.8 9.6)"/>
</svg>
