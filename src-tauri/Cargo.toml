[package]
name = "earth-desk"
version = "1.1.3"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 地球桌面输入法的管道协议（设置页用来问状态、让引擎重新部署）。
ime-proto = { path = "../ime/proto" }
dirs = "5"
sysinfo = "0.32"
tokio = { version = "1", features = ["time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
png = "0.18"
jpeg-encoder = "0.7"
rusqlite = { version = "0.40", features = ["bundled"] }

# The older modules (platform.rs, environment.rs) declare the dozen user32
# calls they need by hand. Gestures, hotkeys, screenshots and the clipboard
# history reach far more of Win32 (hooks, layered windows, Direct2D, COM,
# the clipboard, WIC), so they use Microsoft's own bindings -- the same
# version Tauri's WebView2 layer already builds, so nothing is compiled twice.
[target.'cfg(windows)'.dependencies]
windows-numerics = "0.2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_SystemServices",
  "Win32_System_ProcessStatus",
  "Win32_System_RemoteDesktop",
  "Win32_System_Registry",
  "Win32_System_Environment",
  "Win32_System_Shutdown",
  "Win32_System_TaskScheduler",
  "Win32_System_SystemInformation",
  "Win32_Storage_FileSystem",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Imaging",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Controls",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
strip = true
